name: smartdoc
description: AI-Powered Document Learning App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  audioplayers: ^6.1.0
  flutter_tts: ^4.0.2
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.3
  file_picker: ^8.1.0
  syncfusion_flutter_pdf: ^27.2.5
  syncfusion_flutter_pdfviewer: ^27.2.5
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  path: ^1.9.0
  share_plus: ^12.0.2
  sqflite: ^2.3.0
  flutter_dotenv: ^5.1.0
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: false